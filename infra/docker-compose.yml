services:
  postgres:
    image: postgres:17-alpine
    container_name: yiguan-postgres
    environment:
      POSTGRES_USER: yiguan
      POSTGRES_PASSWORD: yiguan
      POSTGRES_DB: yiguan
    ports:
      - "15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yiguan -d yiguan"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  postgres-test:
    image: postgres:17-alpine
    container_name: yiguan-postgres-test
    environment:
      POSTGRES_USER: yiguan
      POSTGRES_PASSWORD: yiguan
      POSTGRES_DB: yiguan_test
    ports:
      - "15433:5432"
    volumes:
      - type: tmpfs
        target: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yiguan -d yiguan_test"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: yiguan-redis
    ports:
      - "16379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 3s

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: yiguan-minio
    environment:
      MINIO_ROOT_USER: yiguan
      MINIO_ROOT_PASSWORD: yiguanminio
    ports:
      - "19000:9000"
      - "19001:9001"
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mailpit:
    image: axllent/mailpit:v1.30.4
    container_name: yiguan-mailpit
    ports:
      - "11025:1025"
      - "18025:8025"
    volumes:
      - mailpit-data:/data
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATA_FILE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8025"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres-data:
  redis-data:
  minio-data:
  mailpit-data:
