openapi: 3.0.3
info:
  title: Lantern API
  description: |
    Canonical public API contract for the Lantern anonymous social client.

    All public content is authored by an anonymous persona. Persona objects never
    include email addresses, real-profile identifiers, or internal moderation notes.
    Real-profile data is available only through `/v1/me` to an authenticated session.
  version: "1.0.0"
  contact:
    name: Lantern Rebuild Team
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: "{scheme}://{host}:{port}"
    description: Local development server (default)
    variables:
      scheme:
        enum:
          - http
          - https
        default: http
      host:
        default: localhost
      port:
        default: "8080"
  - url: https://api-staging.lantern.app
    description: Staging server
  - url: https://api.lantern.app
    description: Production server
security:
  - BearerAuth: []
tags:
  - name: Auth
    description: Username/password authentication and session management.
  - name: Identity
    description: Real profile and anonymous persona management.
  - name: Topics
    description: Channels/topics, discovery, and follows.
  - name: Posts
    description: Notes/posts and feeds.
  - name: Media
    description: Media upload placeholder for future slices.
  - name: Comments
    description: Replies/comments on notes.
  - name: Reactions
    description: Likes and other reactions.
  - name: Saves
    description: Saved notes for the active persona.
  - name: Reports
    description: User-submitted reports.
  - name: Blocks
    description: Directional persona blocks.
  - name: Moderation
    description: Moderator-only case management.
  - name: InviteCodes
    description: Staff-only invite code management.
paths:
  /v1/healthz:
    get:
      operationId: healthCheck
      summary: Health check
      description: Returns a minimal status response. Does not require authentication.
      security: []
      tags:
        - Health
      responses:
        "200":
          description: Service is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          description: Service is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /v1/auth/register:
    post:
      operationId: register
      summary: Create an account with username and password
      description: |
        Creates a user and returns an access/refresh token pair. Requires a
        Cloudflare Turnstile token.
      security: []
      tags:
        - Auth
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created and session started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Username already taken.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/auth/login:
    post:
      operationId: login
      summary: Sign in with username and password
      description: |
        Verifies the credentials and returns an access/refresh token pair.
        Requires a Cloudflare Turnstile token.
      security: []
      tags:
        - Auth
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Session created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/auth/refresh:
    post:
      operationId: refreshSession
      summary: Refresh an access token
      description: |
        Exchanges a valid refresh token for a new access token. The old access token
        may be rejected shortly after this call.
      security: []
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: New access token issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessTokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/auth/session:
    delete:
      operationId: deleteSession
      summary: Revoke the current session
      description: Revokes the access token used to authenticate the request.
      tags:
        - Auth
      responses:
        "204":
          description: Session revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/me:
    get:
      operationId: getMe
      summary: Get the authenticated real profile
      description: |
        Returns the authenticated real profile, including masked email and persona
        management metadata. Public content is never returned here.
      tags:
        - Identity
      responses:
        "200":
          description: Real profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RealProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      operationId: deleteMe
      summary: Request account deletion
      description: |
        Starts the 30-day account deletion grace period. Requires the account password.
        Within the grace period, logging in cancels the deletion.
      tags:
        - Identity
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountDeletionRequest"
      responses:
        "200":
          description: Deletion initiated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountDeletionState"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /v1/me/email-change-requests:
    post:
      operationId: requestEmailChange
      summary: Request an email change
      description: |
        Sends a verification code to the new email address. The change is confirmed
        with `POST /v1/me/email-change-confirmations`.
      tags:
        - Identity
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailChangeRequest"
      responses:
        "204":
          description: Verification code sent to new email.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/me/email-change-confirmations:
    post:
      operationId: confirmEmailChange
      summary: Confirm an email change
      description: Confirms the new email address using the verification code.
      tags:
        - Identity
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailChangeConfirmation"
      responses:
        "200":
          description: Email changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RealProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /v1/me/export-requests:
    post:
      operationId: requestDataExport
      summary: Request a data export
      description: |
        Requests a machine-readable archive of the authenticated real profile's data.
        Limited to one request per 30 days.
      tags:
        - Identity
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DataExportRequest"
      responses:
        "202":
          description: Export request accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataExport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/me/export-requests/{exportId}:
    get:
      operationId: getDataExport
      summary: Get export request status
      description: Returns the status and download URL of a data export request.
      tags:
        - Identity
      parameters:
        - name: exportId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Export request status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataExport"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/me/personas:
    get:
      operationId: listMyPersonas
      summary: List personas owned by the real profile
      description: |
        Returns all personas owned by the authenticated real profile, including their
        private status and default flag. Public content is not included.
      tags:
        - Identity
      responses:
        "200":
          description: Persona list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PrivatePersona"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createPersona
      summary: Create a new persona
      description: |
        Creates an anonymous persona under the authenticated real profile. A real
        profile may own up to `maxPersonas` active personas.
      tags:
        - Identity
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonaCreateRequest"
      responses:
        "201":
          description: Persona created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivatePersona"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/me/personas/{personaId}:
    get:
      operationId: getMyPersona
      summary: Get a single owned persona
      tags:
        - Identity
      parameters:
        - name: personaId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Owned persona.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivatePersona"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updatePersona
      summary: Update an owned persona
      description: |
        Updates alias, bio, or avatar. Archived personas cannot be updated until
        restored.
      tags:
        - Identity
      parameters:
        - name: personaId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonaUpdateRequest"
      responses:
        "200":
          description: Persona updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivatePersona"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    delete:
      operationId: archivePersona
      summary: Archive an owned persona
      description: |
        Archives a persona. Archived personas no longer appear in public surfaces but
        their historical content remains attributed to the persona.
      tags:
        - Identity
      parameters:
        - name: personaId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: Persona archived.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/me/personas/{personaId}/default:
    put:
      operationId: setDefaultPersona
      summary: Set the default persona
      description: |
        Sets the persona used by default when entering public surfaces. The persona
        must be active.
      tags:
        - Identity
      parameters:
        - name: personaId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Default persona set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivatePersona"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/personas/{personaId}:
    get:
      operationId: getPersona
      summary: Get a public persona profile
      description: |
        Returns public information about a persona. Blocked personas return a masked
        profile with `isBlocked: true`.
      tags:
        - Identity
      security: []
      parameters:
        - name: personaId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Public persona profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Persona"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/personas/{personaId}/posts:
    get:
      operationId: listPersonaPosts
      summary: List notes authored by a persona
      description: |
        Returns published notes authored by the persona. Blocked content is omitted.
      tags:
        - Identity
        - Posts
      security: []
      parameters:
        - name: personaId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Paginated list of notes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CursorPagePost"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/topics:
    get:
      operationId: listTopics
      summary: Discover topics/channels
      description: |
        Returns curated topics. Supports search by `q`. Authenticated users see their
        follow state.
      tags:
        - Topics
      security: []
      parameters:
        - name: q
          in: query
          description: Search query for topic name or description.
          schema:
            type: string
            maxLength: 100
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Paginated list of topics.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CursorPageTopic"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/topics/{topicId}:
    get:
      operationId: getTopic
      summary: Get a topic
      tags:
        - Topics
      security: []
      parameters:
        - name: topicId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Topic details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Topic"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/topics/{topicId}/posts:
    get:
      operationId: listTopicPosts
      summary: List notes in a topic/channel
      tags:
        - Topics
        - Posts
      security: []
      parameters:
        - name: topicId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Paginated list of notes in the topic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CursorPagePost"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/topics/{topicId}/follow:
    post:
      operationId: followTopic
      summary: Follow a topic
      tags:
        - Topics
      parameters:
        - name: topicId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: Topic followed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: unfollowTopic
      summary: Unfollow a topic
      tags:
        - Topics
      parameters:
        - name: topicId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Topic unfollowed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/posts:
    get:
      operationId: listPosts
      summary: Stream feed
      description: |
        Returns the main note feed. If `topicId` is provided, results are scoped to
        that topic. Blocked content is omitted.
      tags:
        - Posts
      security: []
      parameters:
        - name: topicId
          in: query
          description: Filter feed to a single topic.
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Paginated list of notes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CursorPagePost"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createPost
      summary: Create a note
      description: |
        Publishes a new note authored by the active persona. Requires an
        `Idempotency-Key` header to allow safe retries.
      tags:
        - Posts
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostCreateRequest"
      responses:
        "201":
          description: Note created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/posts/{postId}:
    get:
      operationId: getPost
      summary: Get a note
      description: |
        Returns a note. Blocked authors return a masked placeholder. The author sees
        their own rejected/hidden notes with the full `moderationState`.
      tags:
        - Posts
      security: []
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Note detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updatePost
      summary: Edit a note
      description: |
        Edits a note authored by the active persona. Edits are allowed only on
        published or pending-review notes.
      tags:
        - Posts
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostUpdateRequest"
      responses:
        "200":
          description: Note updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    delete:
      operationId: deletePost
      summary: Delete a note
      description: |
        Soft-deletes a note. The note becomes unavailable publicly and appears as
        deleted to the author.
      tags:
        - Posts
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: Note deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/posts/{postId}/comments:
    get:
      operationId: listComments
      summary: List replies to a note
      tags:
        - Comments
      security: []
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Paginated list of replies.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CursorPageComment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createComment
      summary: Reply to a note
      description: |
        Creates a reply authored by the active persona. Requires an
        `Idempotency-Key` header.
      tags:
        - Comments
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentCreateRequest"
      responses:
        "201":
          description: Reply created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
