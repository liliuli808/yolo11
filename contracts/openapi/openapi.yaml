components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Bearer access token returned by `POST /v1/auth/login` or `POST /v1/auth/register`.
  parameters:
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from a previous page's `pagination.nextCursor`.
      schema:
        type: string
        maxLength: 1024
    Limit:
      name: limit
      in: query
      description: Maximum number of items to return. Default 20, maximum 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Client-generated unique key for safely retrying mutating requests. The server
        stores the response for at least 24 hours and replays it for duplicate keys
        targeting the same endpoint and authenticated principal.
      schema:
        type: string
        minLength: 8
        maxLength: 128
  schemas:
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: ok
    ErrorCode:
      type: string
      description: Stable machine-readable error code.
      enum:
        - unauthorized
        - forbidden
        - not_found
        - method_not_allowed
        - conflict
        - rate_limited
        - internal_error
        - not_implemented
        - validation.failed
        - idempotency.conflict
        - idempotency.missing_key
        - auth.invalid_email
        - auth.invalid_code
        - auth.rate_limited
        - auth.session_expired
        - auth.session_revoked
        - auth.invalid_token
        - me.not_found
        - me.deletion_invalid_code
        - me.deletion_already_pending
        - me.email_change_invalid_code
        - me.email_already_used
        - me.email_change_rate_limited
        - me.export_rate_limited
        - me.export_not_ready
        - me.export_not_found
        - persona.not_found
        - persona.not_owned
        - persona.max_reached
        - persona.alias_taken
        - persona.alias_disallowed
        - persona.archived
        - persona.restricted
        - persona.default_required
        - validation.export_format_invalid
        - topic.not_found
        - topic.already_followed
        - topic.not_followed
        - topic.hidden
        - post.not_found
        - post.not_author
        - post.invalid_state
        - post.content_disallowed
        - post.topic_required
        - post.rate_limited
        - comment.not_found
        - comment.not_author
        - comment.invalid_state
        - comment.content_disallowed
        - comment.parent_not_found
        - comment.rate_limited
        - reaction.invalid_type
        - reaction.already_exists
        - reaction.not_found
        - reaction.target_not_found
        - save.already_exists
        - save.not_found
        - media.invalid_format
        - media.too_large
        - block.not_found
        - block.already_exists
        - block.self
        - report.invalid_target
        - report.target_not_found
        - report.duplicate
        - report.details_required
        - report.self
        - moderation.case_not_found
        - moderation.invalid_outcome
        - moderation.invalid_status
        - moderation.report_not_found
        - moderation.not_moderator
        - moderation.rate_limited
    Error:
      type: object
      required:
        - code
        - message
        - requestId
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
          description: Human-readable description of the error.
        requestId:
          type: string
          format: uuid
          description: Request ID to include when contacting support.
    User:
      type: object
      required:
        - id
        - emailMasked
        - status
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        emailMasked:
          type: string
          description: Masked email address, e.g. `a•••@example.com`.
          example: a•••@example.com
        status:
          type: string
          enum:
            - active
            - deleting
            - deleted
            - suspended
            - banned
        createdAt:
          type: string
          format: date-time
    RealProfile:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          required:
            - updatedAt
            - defaultPersonaId
            - personaCount
            - maxPersonas
          properties:
            updatedAt:
              type: string
              format: date-time
            defaultPersonaId:
              type: string
              format: uuid
              nullable: true
            personaCount:
              type: integer
              minimum: 0
            maxPersonas:
              type: integer
              minimum: 1
              example: 5
            deletion:
              type: object
              nullable: true
              allOf:
                - $ref: "#/components/schemas/AccountDeletionState"
    Session:
      type: object
      required:
        - accessToken
        - refreshToken
        - tokenType
        - expiresIn
        - userId
        - personaId
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
          enum:
            - Bearer
        expiresIn:
          type: integer
          description: Access token lifetime in seconds.
        userId:
          type: string
          format: uuid
        personaId:
          type: string
          format: uuid
          nullable: true
          description: Default persona if one has been set.
        isStaff:
          type: boolean
          description: True when the authenticated account has staff privileges.
    AccessTokenResponse:
      type: object
      required:
        - accessToken
        - tokenType
        - expiresIn
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          enum:
            - Bearer
        expiresIn:
          type: integer
        isStaff:
          type: boolean
          description: True when the authenticated account has staff privileges.
    Avatar:
      type: object
      required:
        - seed
        - color
      properties:
        seed:
          type: string
          description: Deterministic seed used to render the generated avatar.
        color:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
          description: Hex color for the avatar background.
    Persona:
      type: object
      required:
        - id
        - alias
        - bio
        - avatar
        - createdAt
        - noteCount
      properties:
        id:
          type: string
          format: uuid
        alias:
          type: string
          minLength: 1
          maxLength: 32
        bio:
          type: string
          nullable: true
          maxLength: 160
        avatar:
          $ref: "#/components/schemas/Avatar"
        createdAt:
          type: string
          format: date-time
        noteCount:
          type: integer
